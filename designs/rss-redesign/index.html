<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f1">
  <meta name="description" content="Streamline RSS 本地交互原型：文章、视频与播客，收进一个安静的内容收件箱。">
  <title>Streamline · 内容收件箱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23a64e36'/%3E%3Cpath d='M18 39c6-15 22 1 28-14M18 29c6-15 22 1 28-14M18 49c6-15 22 1 28-14' fill='none' stroke='%23f8f6f1' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f8f6f1;
      --surface: oklch(99% .006 85);
      --fg: #252620;
      --muted: oklch(47% .018 85);
      --border: oklch(85% .016 85);
      --accent: #a64e36;
      --accent-hover: oklch(43% .11 37);
      --soft: oklch(94% .014 85);
      --selected: oklch(91% .021 85);
      --danger: oklch(43% .15 28);
      --stage: oklch(20% .012 85);
      --stage-fg: oklch(96% .008 85);
      --stage-muted: oklch(79% .012 85);
      --font-display: "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif;
      --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --radius: 12px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --player-height: 0px;
      --z-scrim: 20;
      --z-detail: 30;
      --z-player: 40;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.75 var(--font-body); }
    button, input, select { font: inherit; }
    button, a, input, select { -webkit-tap-highlight-color: transparent; }
    button { min-height: 44px; border: 0; background: transparent; color: var(--fg); cursor: pointer; letter-spacing: .02em; transition: background .2s, transform .2s, border-color .2s; }
    button:hover { background: var(--soft); color: var(--fg); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
    input:focus-visible, select:focus-visible { outline-offset: 2px; }
    h1, h2, h3, p { margin: 0; }
    h1, h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0; line-height: 1.4; text-wrap: balance; }
    p, h3 { text-wrap: pretty; }
    h3 { font-size: 18px; line-height: 1.6; font-weight: 600; }
    svg { flex-shrink: 0; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    [hidden] { display: none !important; }
    .skip { position: fixed; top: -80px; left: 16px; z-index: 60; padding: 10px 16px; background: var(--surface); color: var(--fg); }
    .skip:focus { top: 16px; }
    .shell { display: grid; grid-template-columns: 242px minmax(0, 1fr); min-height: 100dvh; }
    .sidebar { position: sticky; top: 0; height: calc(100dvh - var(--player-height)); display: flex; flex-direction: column; padding: 30px 20px 20px; border-right: 1px solid var(--border); background: var(--bg); overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 35px; }
    .brand-mark { width: 30px; height: 30px; color: var(--accent); }
    .brand-name { font: italic 600 25px/1.2 Georgia, var(--font-display); letter-spacing: -.02em; }
    .nav-group { display: grid; gap: 4px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: 8px; font-weight: 500; }
    .nav-item[aria-current="page"] { background: var(--selected); color: var(--fg); }
    .count { margin-left: auto; min-width: 22px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
    .section-label { display: flex; align-items: center; justify-content: space-between; margin: 30px 12px 10px; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
    .feed-symbol { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 7px; font: 600 13px var(--font-display); }
    .feed-name { min-width: 0; overflow-wrap: anywhere; flex: 1; font-size: 14px; }
    .sidebar-bottom { margin-top: auto; padding-top: 32px; display: grid; gap: 8px; }
    .primary { background: var(--accent); color: var(--surface); border-radius: 8px; padding: 10px 18px; font-weight: 600; }
    .primary:hover { background: var(--accent-hover); color: var(--surface); }
    .secondary { border: 1px solid var(--border); border-radius: 8px; padding: 8px 15px; font-weight: 500; }
    .quiet { padding: 5px 10px; border-radius: 7px; font-size: 13px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; line-height: 1.6; }
    .sidebar-note { margin: 8px 12px 0; font-size: 12px; color: var(--muted); }
    .main { min-width: 0; padding: 34px clamp(24px, 4vw, 64px) calc(80px + var(--player-height)); }
    .main-inner { max-width: 1000px; margin: auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 38px; }
    .breadcrumb { font-size: 13px; color: var(--muted); }
    .search { display: flex; align-items: center; gap: 9px; width: min(340px, 48%); padding: 0 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; }
    .search input { width: 100%; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; color: var(--fg); font-size: 13px; }
    .search:focus-within { outline: 2px solid var(--fg); outline-offset: 2px; }
    .search input::placeholder { color: var(--muted); }
    .icon-button { display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0; border-radius: 8px; flex-shrink: 0; }
    .mobile-menu, .mobile-close { display: none; }
    .heading-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { font-size: 32px; }
    .heading-note { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .heading-tools { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--border); }
    .tab { position: relative; padding: 10px 0 14px; font-size: 14px; color: var(--muted); border-radius: 0; }
    .tab:hover { background: transparent; color: var(--fg); }
    .tab[aria-pressed="true"] { color: var(--fg); font-weight: 600; }
    .tab[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--fg); }
    .tab-count { margin-left: 7px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .list-label { display: flex; justify-content: space-between; gap: 12px; padding: 23px 0 8px; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
    .entry { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 232px; gap: 26px; padding: 26px 0; border-bottom: 1px solid var(--border); }
    .entry.article { grid-template-columns: minmax(0, 1fr) 86px; }
    .entry.podcast { grid-template-columns: minmax(0, 1fr) 126px; }
    .entry-copy { min-width: 0; }
    .entry-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 9px; letter-spacing: .01em; }
    .type-label { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
    .type-label .icon { width: 15px; height: 15px; }
    .unread-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--fg); }
    .entry-title { text-align: left; padding: 0; min-height: auto; background: transparent; letter-spacing: 0; width: 100%; }
    .entry-title:hover { background: transparent; text-decoration: underline; text-underline-offset: 5px; }
    .entry-title h2 { font-size: 23px; line-height: 1.5; overflow-wrap: anywhere; }
    .entry-summary { max-width: 65ch; margin-top: 9px; font-size: 14px; line-height: 1.8; color: var(--muted); }
    .entry-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 11px; font-size: 12px; color: var(--muted); }
    .entry-actions { display: flex; gap: 2px; }
    .entry-actions .icon-button { width: 44px; height: 44px; }
    .is-starred .icon { fill: currentColor; }
    .media-button { padding: 0; min-height: auto; align-self: center; border-radius: 8px; overflow: hidden; position: relative; background: var(--soft); }
    .media-button img { width: 100%; height: auto; display: block; }
    .article .media-button img { aspect-ratio: 1100 / 2014; object-fit: contain; }
    .video .media-button { aspect-ratio: 16 / 9; }
    .video .media-button img { width: 100%; height: 100%; object-fit: cover; }
    .duration-badge { position: absolute; bottom: 8px; right: 8px; padding: 2px 6px; border-radius: 4px; background: var(--stage); color: var(--stage-fg); font-size: 11px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px oklch(20% .012 85 / .2); }
    .podcast-cover { width: 100%; height: auto; aspect-ratio: 1; display: block; }
    .text-entry { grid-template-columns: minmax(0, 1fr) !important; }
    .empty { display: grid; justify-items: center; text-align: center; padding: 72px 20px; gap: 15px; }
    .empty > .icon { width: 42px; height: 42px; color: var(--muted); }
    .empty h2 { font-size: 25px; }
    .empty p { max-width: 40ch; overflow-wrap: anywhere; color: var(--muted); }
    .skeleton { padding: 28px 0; border-bottom: 1px solid var(--border); }
    .skeleton-line { height: 15px; margin-bottom: 15px; max-width: 85%; border-radius: 4px; background: var(--selected); animation: breathe 1.2s ease-in-out infinite alternate; }
    .skeleton-line.short { max-width: 35%; }
    @keyframes breathe { to { opacity: .45; } }
    .scrim { position: fixed; inset: 0; background: oklch(20% .012 85 / .25); z-index: var(--z-scrim); cursor: pointer; }
    .detail { position: fixed; top: 0; bottom: var(--player-height); right: 0; width: min(850px, 94vw); z-index: var(--z-detail); background: var(--bg); overflow-y: auto; box-shadow: -12px 0 48px oklch(25% .018 85 / .1); }
    .detail-top { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .detail-top-left { display: flex; align-items: center; gap: 9px; }
    .detail-body { padding: 34px clamp(22px, 5vw, 66px) 56px; }
    .detail-body h2 { font-size: clamp(26px, 3vw, 34px); margin: 14px 0; overflow-wrap: anywhere; }
    .detail-meta { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
    .reading { max-width: 65ch; margin: auto; }
    .reading p { margin: 20px 0; font-size: 17px; line-height: 1.95; }
    .reading h3 { margin-top: 30px; font-family: var(--font-display); font-size: 23px; }
    .reading-image { width: auto; max-width: 100%; height: auto; max-height: 360px; display: block; margin: 24px auto 8px; }
    .image-caption { text-align: center; font-size: 12px; color: var(--muted); }
    .demo-note { padding: 12px 15px; background: var(--soft); border-radius: 6px; font-size: 13px; line-height: 1.7; }
    .video-stage { position: relative; aspect-ratio: 16 / 9; background: var(--stage); color: var(--stage-fg); border-radius: 8px; overflow: hidden; }
    .video-stage img { width: 100%; height: 100%; object-fit: cover; opacity: .7; }
    .stage-overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; background: oklch(20% .012 85 / .2); }
    .stage-play { width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--stage-fg); background: var(--stage); color: var(--stage-fg); }
    .stage-play:hover { background: oklch(28% .012 85); color: var(--stage-fg); }
    .stage-caption { font-size: 13px; padding: 4px 9px; background: var(--stage); color: var(--stage-fg); border-radius: 4px; }
    .video-controls { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; font-size: 13px; }
    input[type="range"] { accent-color: var(--fg); min-width: 0; cursor: pointer; min-height: 44px; }
    .video-controls input[type="range"] { flex: 1; min-width: 100px; }
    select { min-height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); padding: 7px 9px; max-width: 100%; }
    .episode-header { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; align-items: center; margin-bottom: 28px; }
    .episode-header h2 { font-size: 27px; margin: 8px 0; }
    .notes-list { display: grid; gap: 0; padding: 0; margin: 16px 0 24px; list-style: none; }
    .notes-list li { border-top: 1px solid var(--border); }
    .chapter { width: 100%; text-align: left; display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 14px; padding: 15px 4px; font-size: 14px; }
    .chapter-time { font-variant-numeric: tabular-nums; color: var(--muted); }
    .mini-player { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-player); background: var(--surface); border-top: 1px solid var(--border); padding: 12px 24px; height: var(--player-height); }
    .player-inner { max-width: 1400px; margin: auto; display: grid; grid-template-columns: minmax(180px, 1fr) minmax(280px, 1.5fr) auto; gap: 26px; align-items: center; height: 100%; }
    .player-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mini-cover { width: 56px; height: 56px; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .player-title { padding: 0; min-height: 44px; text-align: left; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    .player-title:hover { background: transparent; text-decoration: underline; }
    .player-controls { display: grid; gap: 0; }
    .transport { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .transport .icon-button { width: 44px; height: 44px; }
    .transport-main { background: var(--fg); color: var(--surface); border-radius: 50%; }
    .transport-main:hover { background: oklch(28% .018 85); color: var(--surface); }
    .timeline { display: flex; align-items: center; gap: 10px; font-size: 11px; font-variant-numeric: tabular-nums; }
    .timeline input { width: 100%; min-height: 24px; }
    .player-extra { display: flex; align-items: center; gap: 8px; }
    .player-extra select { font-size: 13px; border: 0; background: transparent; }
    dialog { width: min(490px, calc(100% - 32px)); max-height: calc(100dvh - 48px); padding: 26px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 14px; overflow-y: auto; }
    dialog::backdrop { background: oklch(20% .012 85 / .3); }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .dialog-header h2 { font-size: 26px; }
    .form-field { display: grid; gap: 7px; margin-top: 18px; font-size: 13px; }
    .form-field input { min-height: 46px; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--fg); }
    .form-field input[aria-invalid="true"] { border-color: var(--danger); }
    .field-error { color: var(--danger); min-height: 20px; font-size: 12px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .account-actions { display: grid; gap: 10px; margin-top: 20px; }
    .toast { position: fixed; left: 50%; bottom: calc(var(--player-height) + 20px); transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 14px; width: max-content; max-width: calc(100% - 32px); padding: 7px 10px 7px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: 0 5px 24px oklch(25% .018 85 / .12); font-size: 13px; }
    .toast-text { overflow-wrap: anywhere; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 1024px) {
      .shell { grid-template-columns: 210px minmax(0, 1fr); }
      .sidebar { padding: 26px 12px 16px; }
      .main { padding-left: 28px; padding-right: 28px; }
      .entry { grid-template-columns: minmax(0, 1fr) 180px; gap: 20px; }
      .entry.podcast { grid-template-columns: minmax(0, 1fr) 104px; }
      .player-inner { gap: 16px; grid-template-columns: minmax(170px, 1fr) minmax(220px, 1fr) auto; }
    }
    @media (max-width: 767px) {
      .shell { display: block; }
      .sidebar { display: none; position: fixed; top: 0; bottom: var(--player-height); left: 0; width: min(300px, 85vw); height: auto; z-index: var(--z-detail); padding: 24px 18px; }
      .sidebar.is-open { display: flex; }
      .mobile-menu, .mobile-close { display: inline-grid; }
      .mobile-close { margin-left: auto; }
      .brand { padding-bottom: 26px; }
      .main { padding: 18px 20px calc(56px + var(--player-height)); }
      .topbar { gap: 12px; margin-bottom: 26px; }
      .breadcrumb { display: none; }
      .search { width: 100%; }
      .heading-row { align-items: start; gap: 10px; margin-bottom: 18px; }
      h1 { font-size: 28px; }
      .heading-tools .quiet { font-size: 0; width: 44px; padding: 0; }
      .heading-tools .quiet .icon { width: 19px; height: 19px; }
      .tabs { gap: 0; justify-content: space-between; }
      .tab { font-size: 13px; }
      .tab-count { margin-left: 5px; }
      .entry, .entry.article, .entry.podcast { grid-template-columns: minmax(0, 1fr) 82px; gap: 15px; padding: 23px 0; }
      .entry.video { grid-template-columns: minmax(0, 1fr); }
      .video .media-button { grid-row: 1; }
      .entry-title h2 { font-size: 21px; }
      .entry-summary { font-size: 13px; }
      .entry-footer { align-items: center; gap: 5px; }
      .entry-footer > span { max-width: 22ch; }
      .detail { width: 100%; }
      .detail-top { padding: 10px 16px; }
      .detail-body { padding: 26px 22px 40px; }
      .episode-header { grid-template-columns: 92px minmax(0, 1fr); gap: 16px; }
      .episode-header h2 { font-size: 23px; }
      .reading p { font-size: 16px; }
      .mini-player { padding: 9px 16px; }
      .player-inner { grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: start; }
      .mini-cover { width: 42px; height: 42px; }
      .player-title { font-size: 12px; min-height: 40px; }
      .player-info .small { font-size: 11px; }
      .player-controls { grid-column: 1 / -1; grid-row: 2; }
      .transport { position: absolute; top: 9px; right: 16px; gap: 2px; }
      .transport .skip-button { display: none; }
      .player-info { padding-right: 52px; grid-column: 1 / -1; }
      .player-extra { position: absolute; right: 13px; bottom: 7px; }
      .player-extra .close-player { display: none; }
      .timeline { padding-right: 77px; gap: 7px; }
      .timeline input { min-height: 44px; }
      .player-extra select { min-height: 36px; padding: 3px; }
      .player-extra .demo-label { display: none; }
      .stage-play { width: 52px; height: 52px; }
      .video-controls { gap: 8px; }
      .empty { padding: 48px 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

  <script>
    const byId = id => document.getElementById(id);
    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, character => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[character]));
    const typeNames = { all: "全部", article: "文章", video: "视频", podcast: "播客" };
    const typeIcons = { article: "book", video: "video", podcast: "audio" };
    const initialFeeds = [
      { id:"reading", title:"纸上日常", type:"article", source:"知乎", url:"https://example.com/reading.xml" },
      { id:"coast", title:"沿途观察", type:"video", source:"B站", url:"https://example.com/coast.xml" },
      { id:"slow", title:"慢慢听", type:"podcast", source:"播客", url:"https://example.com/slow.xml" }
    ];
    const demoEntries = [
      { id:"a1", feed_id:"reading", media_type:"article", title:"把阅读从收藏夹里，重新放回生活", feed_title:"纸上日常", feed_source:"知乎", author:"演示作者 · 林简", summary:"我们收藏了很多文章，却很少再打开。与其等一个完整的下午，不如从今天的十分钟开始，给阅读留一个具体的位置。", thumbnail:"assets/reading-desk.jpg", duration:420, published_at:"2026-10-14", is_read:false, is_starred:false },
      { id:"v1", feed_id:"coast", media_type:"video", title:"沿着海岸走一段，把时间慢下来", feed_title:"沿途观察", feed_source:"B站", author:"演示UP主 · 沿途观察", summary:"海风、浪声和一段没有目的地的步行。这是一份关于观察日常的影像脚本，点击进入站内演示舞台。", thumbnail:"assets/coast.jpg", duration:752, published_at:"2026-10-14", is_read:false, is_starred:false },
      { id:"p1", feed_id:"slow", media_type:"podcast", title:"在忙碌的日子里，留一点空白", feed_title:"慢慢听", feed_source:"播客", author:"演示主播 · 许宁 / 林简", summary:"第028集 · 聊聊散步、发呆，以及不必被安排好的周末。让耳朵先出发，事情可以慢一点。", duration:2844, published_at:"2026-10-13", is_read:false, is_starred:false, episode:"028" },
      { id:"a2", feed_id:"reading", media_type:"article", title:"一张小桌子，如何成为自己的阅读角落", feed_title:"纸上日常", feed_source:"知乎", author:"演示作者 · 林简", summary:"一个可以放下手机、摊开书页的地方，不需要很大。从光线、桌面和伸手可及的书开始，整理出属于自己的秩序。", duration:300, published_at:"2026-10-12", is_read:true, is_starred:true },
      { id:"p2", feed_id:"slow", media_type:"podcast", title:"不赶路的时候，我们会看见什么", feed_title:"慢慢听", feed_source:"播客", author:"演示主播 · 许宁", summary:"第027集 · 从一条熟悉的街道聊起，重新发现每天经过的树、店铺和人。附带一份可以边听边走的章节笔记。", duration:2216, published_at:"2026-10-11", is_read:false, is_starred:true, episode:"027" },
      { id:"v2", feed_id:"coast", media_type:"video", title:"海边的一天：从清晨到日落", feed_title:"沿途观察", feed_source:"B站", author:"演示UP主 · 沿途观察", summary:"同一片海，在不同的光线里呈现不同的节奏。封面复用本地海岸照片，播放为无视频流的交互演示。", thumbnail:"assets/coast.jpg", duration:1138, published_at:"2026-10-10", is_read:false, is_starred:false }
    ];
    const state = { scope:"inbox", type:"all", feedId:null, query:"", detailId:null, menu:false, loading:false, openerId:null };
    const audio = { id:null, playing:false, progress:0, speed:1 };
    const video = { id:null, playing:false, progress:0, quality:"1080" };
    let feeds = initialFeeds.map(feed => ({ ...feed }));
    let entries = demoEntries.map(entry => ({ ...entry }));
    let storageWarning = false;
    try {
      const saved = JSON.parse(localStorage.getItem("streamline:prototype:v1") || "null");
      if (saved && Array.isArray(saved.feeds)) {
        const extraFeeds = saved.feeds.filter(feed => /^mock-/.test(feed.id) && typeNames[feed.type] && feed.type !== "all" && typeof feed.title === "string" && typeof feed.url === "string");
        feeds.push(...extraFeeds.map(feed => ({ id:feed.id, title:feed.title.slice(0,80), type:feed.type, source:feed.source || "演示来源", url:feed.url })));
        if (Array.isArray(saved.added)) entries.push(...saved.added.filter(entry => feeds.some(feed => feed.id === entry.feed_id) && /^mock-entry-/.test(entry.id)).map(entry => ({ ...demoEntries.find(item => item.media_type === feeds.find(feed => feed.id === entry.feed_id).type), id:entry.id, feed_id:entry.feed_id, feed_title:feeds.find(feed => feed.id === entry.feed_id).title, is_read:!!entry.is_read, is_starred:!!entry.is_starred })));
        entries.forEach(entry => { const record = saved.flags?.[entry.id]; if (record) { entry.is_read = !!record.read; entry.is_starred = !!record.starred; } });
      }
    } catch { storageWarning = true; }
    function persist() {
      try { localStorage.setItem("streamline:prototype:v1", JSON.stringify({ feeds:feeds.filter(feed => /^mock-/.test(feed.id)), added:entries.filter(entry => /^mock-entry-/.test(entry.id)).map(entry => ({ id:entry.id, feed_id:entry.feed_id, is_read:entry.is_read, is_starred:entry.is_starred })), flags:Object.fromEntries(entries.map(entry => [entry.id, { read:entry.is_read, starred:entry.is_starred }])) })); }
      catch { notify("浏览器不允许保存；本次操作仍有效，关闭页面后不会保留。"); }
    }
    function cover(episode = "028") {
      return `<svg class="podcast-cover" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="慢慢听演示节目封面，第${escapeHtml(episode)}集"><rect width="240" height="240" fill="oklch(89% .033 85)"/><circle cx="190" cy="54" r="75" fill="oklch(83% .036 85)"/><path d="M25 175h190M25 185h190" stroke="oklch(47% .018 85)" stroke-width="1"/><text x="24" y="70" fill="#252620" font-family="Songti SC,STSong,serif" font-size="39">慢慢听</text><text x="25" y="98" fill="oklch(47% .018 85)" font-family="PingFang SC,sans-serif" font-size="11" letter-spacing="1">给日常一点留白</text><path d="M27 142v12m13-22v32m13-40v48m13-33v18m13-35v52m13-42v32m13-22v12m13-31v50m13-39v28m13-20v12m13-28v44m13-34v24" stroke="#252620" stroke-width="3"/><text x="25" y="214" fill="#252620" font-family="PingFang SC,sans-serif" font-size="12">演示节目 / EP.${escapeHtml(episode)}</text></svg>`;
    }
    function notify(message) { byId("toast-text").textContent = message; byId("toast").hidden = false; }
    function announce(message) { byId("announcer").textContent = message; }
    function time(seconds) { const safe = Math.max(0, Math.floor(seconds)); return `${String(Math.floor(safe / 60)).padStart(2,"0")}:${String(safe % 60).padStart(2,"0")}`; }
    function scopeEntries() {
      return entries.filter(entry => (!state.feedId || entry.feed_id === state.feedId) && (state.scope !== "unread" || !entry.is_read) && (state.scope !== "starred" || entry.is_starred) && `${entry.title} ${entry.summary} ${entry.author} ${entry.feed_title}`.toLocaleLowerCase().includes(state.query.toLocaleLowerCase()));
    }
    function visibleEntries() { return scopeEntries().filter(entry => state.type === "all" || entry.media_type === state.type); }
    function renderNav() {
      const libraries = [["inbox","inbox","内容收件箱",entries.length],["unread","unread","未读内容",entries.filter(entry => !entry.is_read).length],["starred","star","我的收藏",entries.filter(entry => entry.is_starred).length]];
      byId("library-nav").innerHTML = libraries.map(([scope, symbol, title, count]) => `<button class="nav-item" data-scope="${scope}" data-od-id="nav-${scope}" ${!state.feedId && state.scope === scope ? 'aria-current="page"' : ""}>${icon(symbol)}<span>${title}</span><span class="count">${count}</span></button>`).join("");
      byId("feed-nav").innerHTML = feeds.map(feed => `<button class="nav-item" data-feed="${escapeHtml(feed.id)}" data-od-id="feed-${escapeHtml(feed.id)}" ${state.feedId === feed.id ? 'aria-current="page"' : ""}><span class="feed-symbol" aria-hidden="true">${typeNames[feed.type].slice(0,1)}</span><span class="feed-name">${escapeHtml(feed.title)}</span><span class="count">${entries.filter(entry => entry.feed_id === feed.id && !entry.is_read).length}</span></button>`).join("");
      byId("feed-total").textContent = feeds.length;
    }
    function renderEntry(entry) {
      const hasMedia = entry.thumbnail || entry.media_type === "podcast";
      const image = entry.media_type === "podcast" ? cover(entry.episode) : `<img src="${escapeHtml(entry.thumbnail)}" width="1100" height="${entry.media_type === "article" ? "2014" : "734"}" alt="${entry.media_type === "article" ? "本地素材：书桌与阅读环境" : "本地素材：海岸风景"}" loading="lazy">${entry.media_type === "video" ? `<span class="duration-badge">${time(entry.duration)}</span>` : ""}`;
      return `<article class="entry ${entry.media_type} ${hasMedia ? "" : "text-entry"}" data-od-id="entry-${escapeHtml(entry.id)}"><div class="entry-copy"><div class="entry-meta"><span class="type-label">${icon(typeIcons[entry.media_type])}${typeNames[entry.media_type]}</span><span>·</span><span>${escapeHtml(entry.feed_title)}</span><span>· ${escapeHtml(entry.published_at.slice(5).replace("-","月"))}日</span>${!entry.is_read ? '<span class="unread-dot" aria-label="未读"></span>' : '<span>已读</span>'}</div><button class="entry-title" id="open-${escapeHtml(entry.id)}" data-open="${escapeHtml(entry.id)}" data-od-id="title-${escapeHtml(entry.id)}"><h2>${escapeHtml(entry.title)}</h2></button><p class="entry-summary">${escapeHtml(entry.summary)}</p><div class="entry-footer"><span>${escapeHtml(entry.author)}${entry.media_type === "article" ? ` · ${Math.ceil(entry.duration / 60)}分钟阅读` : ""}</span><div class="entry-actions"><button class="icon-button ${entry.is_starred ? "is-starred" : ""}" data-star="${escapeHtml(entry.id)}" aria-pressed="${entry.is_starred}" aria-label="${entry.is_starred ? "取消收藏" : "收藏"}：${escapeHtml(entry.title)}" data-od-id="star-${escapeHtml(entry.id)}">${icon("star")}</button><button class="icon-button" data-read="${escapeHtml(entry.id)}" aria-label="${entry.is_read ? "标为未读" : "标为已读"}：${escapeHtml(entry.title)}" data-od-id="read-${escapeHtml(entry.id)}">${icon(entry.is_read ? "unread" : "check")}</button></div></div></div>${hasMedia ? `<button class="media-button" data-open="${escapeHtml(entry.id)}" aria-label="打开${typeNames[entry.media_type]}：${escapeHtml(entry.title)}" data-od-id="cover-${escapeHtml(entry.id)}">${image}</button>` : ""}</article>`;
    }
    function render() {
      renderNav();
      const matching = scopeEntries();
      const visible = visibleEntries();
      const selectedFeed = feeds.find(feed => feed.id === state.feedId);
      byId("view-title").textContent = selectedFeed?.title || ({ inbox:"内容收件箱", unread:"未读内容", starred:"我的收藏" })[state.scope];
      byId("view-note").textContent = selectedFeed ? `${selectedFeed.source} · 本地演示订阅` : state.scope === "starred" ? "留给下次的好内容，都在这里。" : state.scope === "unread" ? "还没打开的内容，不必一次读完。" : "让值得停留的内容，有一个安静的地方。";
      byId("type-tabs").innerHTML = Object.entries(typeNames).map(([type, title]) => `<button class="tab" data-type="${type}" aria-pressed="${state.type === type}" data-od-id="filter-${type}">${title}<span class="tab-count">${type === "all" ? matching.length : matching.filter(entry => entry.media_type === type).length}</span></button>`).join("");
      byId("result-count").textContent = `${visible.length} 条内容`;
      byId("clear-search").hidden = !state.query;
      byId("mark-all").disabled = !visible.some(entry => !entry.is_read) || state.loading;
      byId("refresh").disabled = state.loading;
      if (state.loading) {
        byId("entries").innerHTML = Array.from({ length:3 }, () => '<div class="skeleton" aria-hidden="true"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>').join("");
      } else if (visible.length) { byId("entries").innerHTML = visible.map(renderEntry).join(""); }
      else {
        const noFeedEntries = selectedFeed && !entries.some(entry => entry.feed_id === selectedFeed.id);
        const title = state.query ? "没有找到这份内容" : noFeedEntries ? "新订阅，先留一个位置" : state.scope === "unread" ? "这一页已经读完了" : state.scope === "starred" ? "收藏夹还很安静" : "这个分类暂时没有内容";
        const description = state.query ? `没有与“${state.query}”匹配的内容。试试短一点的词，或搜索订阅名称。` : noFeedEntries ? "这个地址只保存在演示订阅中。可以放入一条对应类型的示例，查看后续流程。" : state.scope === "starred" ? "点击内容旁的星标，把想再读、再看、再听的内容留下。" : "可以回到全部内容，继续按照自己的节奏浏览。";
        byId("entries").innerHTML = `<section class="empty" data-od-id="empty-state">${icon(noFeedEntries ? "inbox" : state.scope === "starred" ? "star" : "book")}<h2>${title}</h2><p>${escapeHtml(description)}</p><button class="primary" id="empty-action" data-od-id="empty-action">${state.query ? "清空搜索" : noFeedEntries ? "放入一条演示内容" : "浏览全部内容"}</button></section>`;
      }
    }
    function toggleStar(id) { const entry = entries.find(item => item.id === id); if (!entry) return; entry.is_starred = !entry.is_starred; persist(); render(); syncDetailStar(); announce(entry.is_starred ? "已收藏" : "已取消收藏"); }
    function syncDetailStar() { const entry = entries.find(item => item.id === state.detailId); if (!entry) return; byId("detail-star").innerHTML = icon("star"); byId("detail-star").classList.toggle("is-starred", entry.is_starred); byId("detail-star").setAttribute("aria-pressed", entry.is_starred); byId("detail-star").setAttribute("aria-label", entry.is_starred ? "取消收藏当前内容" : "收藏当前内容"); }
    function articleContent(entry) {
      const second = entry.id === "a2";
      return `<article class="reading" data-od-id="article-reader"><p class="small muted">知乎文章 · 原创演示文稿</p><h2 id="detail-title">${escapeHtml(entry.title)}</h2><p class="detail-meta">${escapeHtml(entry.author)} · ${entry.published_at} · ${Math.ceil(entry.duration / 60)}分钟阅读</p><p class="demo-note">这是为原型编写的完整演示文章，不对应真实知乎发布内容，也不代表你的订阅。</p><p>${second ? "阅读角落不一定是一间书房。它可以是窗边的一张小桌子，也可以是晚饭后暂时清空的餐桌。重要的不是面积，而是坐下来时，知道接下来的时间可以交给一本书。" : "收藏一篇文章，往往只是一个轻轻的动作。我们看见一个好标题，觉得以后会有时间，于是把它放进收藏夹。日子继续往前走，那些想读的内容却停在原地。"}</p><h3>${second ? "先给桌面减一点东西" : "不要等到时间完整的时候"}</h3><p>${second ? "留下灯、正在读的书和一杯水，就已经足够。暂时不需要的纸张可以移到另一边，手机也不必放在手边。桌面空出来的，不只是一个位置，也是一个不用立刻回应其他事情的机会。" : "一个没有打扰的下午当然很好，但它不是开始阅读的必要条件。早晨出门前的十分钟，午饭后的一小段空隙，睡前放下手机的片刻，都可以是一篇文章的入口。给阅读一个具体的位置，比给它一个遥远的承诺更有用。"}</p>${entry.thumbnail ? `<figure><img class="reading-image" src="${escapeHtml(entry.thumbnail)}" width="1100" height="2014" alt="本地阅读桌面照片，完整展示原始画面"><figcaption class="image-caption">项目本地素材 · 阅读环境</figcaption></figure>` : ""}<h3>${second ? "让光落在书页上" : "读完之后，留下一个自己的句子"}</h3><p>${second ? "尽量把灯放在写字手的另一侧，减少手臂落在纸上的影子。自然光很舒服，但傍晚也需要一盏稳定的灯。不必追求一种完美布置，只要眼睛不用费力，身体不用一直寻找姿势。" : "不必为每篇文章做一份笔记。可以只记住一个问题，或者写下一句和自己有关的话。这样的停顿会让内容从“看过”变成“想过”，也让下一次回到它时，有一条能继续走下去的线索。"}</p><p>${second ? "当阅读结束，把书签放好，让正在读的书留在原处。下次坐下来时，不需要重新布置，也不需要决定从哪里开始。一个小小的角落，就这样慢慢成为生活中稳定的一部分。" : "也许真正需要整理的，并不是越来越长的收藏列表，而是我们和内容相处的方式。少一点积攒，多一点打开；少一点赶进度，多一点停留。今天读完一小段，就已经很好。"}</p><p class="small muted">文稿结束 · 关闭详情后，可在信息流中重新标为未读。</p></article>`;
    }
    function videoContent(entry) {
      return `<section data-od-id="video-detail"><p class="small muted">B站视频 · 本地演示</p><h2 id="detail-title">${escapeHtml(entry.title)}</h2><p class="detail-meta">${escapeHtml(entry.author)} · ${entry.published_at} · ${time(entry.duration)}</p><div class="video-stage" data-od-id="video-stage"><img src="${escapeHtml(entry.thumbnail)}" width="1100" height="734" alt="演示舞台使用的海岸照片，按16比9装饰性裁切"><div class="stage-overlay"><button class="icon-button stage-play" id="video-toggle" aria-label="开始视频播放演示" data-od-id="video-toggle">${icon("play")}</button><span class="stage-caption" id="video-status">演示舞台 · 不含真实视频流</span></div></div><div class="video-controls"><span id="video-time">00:00 / ${time(entry.duration)}</span><input type="range" id="video-progress" min="0" max="${entry.duration}" value="0" aria-label="视频演示进度" data-od-id="video-progress"><label>清晰度 <select id="video-quality" data-od-id="video-quality"><option value="1080">1080P</option><option value="720">720P</option></select></label></div><p class="demo-note" id="quality-note">已选择1080P；演示返回档位720P。实际清晰度：未获取，无真实B站流。</p><h3 style="margin-top:24px">关于这段内容</h3><p class="entry-summary">${escapeHtml(entry.summary)}</p><p class="entry-summary">演示脚本：从海岸步道出发，观察浪花、岩石和远处的光。这里用静态照片与可操作进度展示站内观看流程，不会播放声音或请求B站。</p></section>`;
    }
    function podcastContent(entry) {
      const chapters = [[0,"从一段没有安排的时间开始"],[180,"散步时，注意力会去哪里"],[720,"不把休息变成另一项任务"],[1500,"给下个周末留一个空白"]];
      return `<section data-od-id="podcast-detail"><div class="episode-header"><div>${cover(entry.episode)}</div><div><p class="small muted">慢慢听 · 第${escapeHtml(entry.episode)}集 · 演示节目</p><h2 id="detail-title">${escapeHtml(entry.title)}</h2><p class="small muted">${escapeHtml(entry.author)}<br>${time(entry.duration)} · ${entry.published_at}</p></div></div><button class="secondary" id="episode-play" data-od-id="episode-play">${audio.id === entry.id && audio.playing ? "暂停演示收听" : "开始演示收听"}</button><p class="entry-summary">${escapeHtml(entry.summary)}</p><h3 style="margin-top:28px">节目笔记 · Show Notes</h3><p class="entry-summary">这一集从忙碌后的疲惫聊起：为什么空闲有时也让人焦虑？我们分享了不赶路的散步、关掉提醒的下午，以及如何把“什么都不做”留在日程之外。</p><ul class="notes-list">${chapters.map(([seconds, title]) => `<li><button class="chapter" data-chapter="${seconds}" data-od-id="chapter-${seconds}"><span class="chapter-time">${time(seconds)}</span><span>${title}</span></button></li>`).join("")}</ul><p class="demo-note">点击时间点可跳转演示进度。关闭本详情、打开文章或视频，小播放器仍会保留。当前没有真实音频。</p><p class="entry-summary">本集练习：下次出门时，先不打开地图，沿着熟悉的路走十分钟。留意一个平常忽略的声音，再把它记下来。无需完成任务，只是给自己一个观察的机会。</p></section>`;
    }
    function openDetail(id, openerId) {
      const entry = entries.find(item => item.id === id); if (!entry) return;
      closeMenu(); state.detailId = id; state.openerId = openerId || `open-${id}`;
      video.playing = false; video.id = entry.media_type === "video" ? id : null; video.progress = 0; video.quality = "1080";
      entry.is_read = true; persist(); render();
      byId("detail-type").textContent = `${typeNames[entry.media_type]}详情`;
      byId("detail-body").innerHTML = entry.media_type === "article" ? articleContent(entry) : entry.media_type === "video" ? videoContent(entry) : podcastContent(entry);
      byId("detail").hidden = false; byId("scrim").hidden = false; byId("shell").inert = true;
      byId("detail").scrollTop = 0; syncDetailStar(); byId("close-detail").focus({ preventScroll:true });
      announce(`已打开${typeNames[entry.media_type]}详情，内容标为已读`);
    }
    function closeDetail() { if (!state.detailId) return; state.detailId = null; video.playing = false; video.id = null; byId("detail").hidden = true; byId("scrim").hidden = true; byId("shell").inert = false; (byId(state.openerId) || byId("main")).focus({ preventScroll:true }); }
    function openMenu() { state.menu = true; byId("sidebar").classList.add("is-open"); byId("scrim").hidden = false; byId("main").inert = true; byId("open-menu").setAttribute("aria-expanded","true"); byId("close-menu").focus(); }
    function closeMenu() { if (!state.menu) return; state.menu = false; byId("sidebar").classList.remove("is-open"); byId("scrim").hidden = true; byId("main").inert = false; byId("open-menu").setAttribute("aria-expanded","false"); byId("open-menu").focus({ preventScroll:true }); }
    function startAudio(id, seconds) {
      const entry = entries.find(item => item.id === id && item.media_type === "podcast"); if (!entry) return;
      if (audio.id !== id) { audio.id = id; audio.progress = 0; }
      if (seconds !== undefined) audio.progress = Math.min(entry.duration, Math.max(0, seconds));
      if (audio.progress >= entry.duration) audio.progress = 0;
      audio.playing = true; entry.is_read = true; persist(); render();
      byId("mini-cover").innerHTML = cover(entry.episode); byId("player-title").textContent = entry.title;
      byId("audio-duration").textContent = time(entry.duration); byId("audio-progress").max = entry.duration;
      byId("mini-player").hidden = false; resizePlayer(); syncAudio(); announce("已开始播客演示，无真实音频");
    }
    function resizePlayer() { document.documentElement.style.setProperty("--player-height", audio.id ? (window.innerWidth < 768 ? "118px" : "104px") : "0px"); }
    function syncAudio() {
      if (!audio.id) return;
      byId("audio-time").textContent = time(audio.progress); byId("audio-progress").value = audio.progress;
      byId("audio-toggle").innerHTML = icon(audio.playing ? "pause" : "play"); byId("audio-toggle").setAttribute("aria-label", audio.playing ? "暂停播客演示" : "继续播客演示");
      if (byId("episode-play")) byId("episode-play").textContent = audio.id === state.detailId && audio.playing ? "暂停演示收听" : "开始演示收听";
    }
    function syncVideo() {
      const entry = entries.find(item => item.id === video.id); if (!entry || !byId("video-toggle")) return;
      byId("video-toggle").innerHTML = icon(video.playing ? "pause" : "play"); byId("video-toggle").setAttribute("aria-label", video.playing ? "暂停视频演示" : "开始视频演示");
      byId("video-status").textContent = video.playing ? "正在演示播放 · 静态封面，无视频流" : "演示已暂停 · 无真实视频流";
      byId("video-time").textContent = `${time(video.progress)} / ${time(entry.duration)}`; byId("video-progress").value = video.progress;
    }
    function toggleVideo() {
      const entry = entries.find(item => item.id === video.id); if (!entry) return;
      if (!video.playing && audio.playing) { audio.playing = false; syncAudio(); notify("播客演示已暂停，收听进度保留。"); }
      if (video.progress >= entry.duration) video.progress = 0; video.playing = !video.playing; syncVideo();
    }
    function openFeedDialog() { closeMenu(); byId("account-dialog").close(); byId("feed-dialog").showModal(); }
    function validateUrl() {
      let error = ""; const value = byId("feed-url").value.trim();
      try { const address = new URL(value); if (!["http:","https:"].includes(address.protocol) || !address.hostname.includes(".") || address.username || address.password) error = "请输入不含账号密码的 HTTP / HTTPS 订阅地址。"; }
      catch { error = value ? "地址格式不完整，请填写 https:// 开头的完整地址。" : "请先填写订阅地址，或使用示例来源。"; }
      if (!error && feeds.some(feed => feed.url === value)) error = "这个地址已经在演示订阅中，请换一个地址。";
      byId("url-error").textContent = error; byId("feed-url").setAttribute("aria-invalid", String(!!error)); return !error;
    }
    document.addEventListener("click", event => {
      const button = event.target.closest("button"); if (!button) return;
      if (button.dataset.scope) { state.scope = button.dataset.scope; state.feedId = null; render(); closeMenu(); }
      if (button.dataset.feed) { state.feedId = button.dataset.feed; state.scope = "inbox"; render(); closeMenu(); }
      if (button.dataset.type) { state.type = button.dataset.type; render(); byId("type-tabs").querySelector(`[data-type="${state.type}"]`).focus({ preventScroll:true }); announce(`已筛选${typeNames[state.type]}，${visibleEntries().length}条内容`); }
      if (button.dataset.open) openDetail(button.dataset.open, `open-${button.dataset.open}`);
      if (button.dataset.star) { toggleStar(button.dataset.star); byId("entries").querySelector(`[data-star="${button.dataset.star}"]`)?.focus({ preventScroll:true }); }
      if (button.dataset.read) { const entry = entries.find(item => item.id === button.dataset.read); entry.is_read = !entry.is_read; persist(); render(); announce(entry.is_read ? "已标为已读" : "已标为未读"); }
      if (button.dataset.chapter !== undefined) { video.playing = false; syncVideo(); startAudio(state.detailId, Number(button.dataset.chapter)); }
      if (button.id === "empty-action") {
        const feed = feeds.find(item => item.id === state.feedId);
        if (state.query) { state.query = ""; byId("search").value = ""; }
        else if (feed && !entries.some(entry => entry.feed_id === feed.id)) { const template = demoEntries.find(entry => entry.media_type === feed.type); entries.unshift({ ...template, id:`mock-entry-${Date.now()}`, feed_id:feed.id, feed_title:feed.title, is_read:false, is_starred:false }); persist(); }
        else { state.scope = "inbox"; state.feedId = null; state.type = "all"; }
        render(); byId("main").focus({ preventScroll:true });
      }
      if (button.id === "video-toggle") toggleVideo();
      if (button.id === "episode-play") { if (audio.id === state.detailId && audio.playing) { audio.playing = false; syncAudio(); } else { video.playing = false; startAudio(state.detailId); } }
    });
    byId("search").addEventListener("input", event => { state.query = event.target.value.trim(); render(); });
    byId("clear-search").onclick = () => { byId("search").value = ""; state.query = ""; render(); byId("search").focus(); };
    byId("mark-all").onclick = () => { visibleEntries().forEach(entry => entry.is_read = true); persist(); render(); notify("当前筛选中的内容已标为已读。"); };
    byId("refresh").onclick = () => {
      state.loading = true; render(); byId("load-status").textContent = "正在整理本地演示内容…";
      const slowNotice = setTimeout(() => byId("load-status").textContent = "整理时间比预期长，可以继续浏览订阅导航。",15000);
      const timeout = setTimeout(() => { state.loading = false; clearTimeout(slowNotice); render(); byId("load-status").textContent = "本地演示整理超时，请再次点击刷新。"; },30000);
      setTimeout(() => { clearTimeout(timeout); clearTimeout(slowNotice); state.loading = false; render(); byId("load-status").textContent = "演示内容已刷新；没有请求真实订阅。"; byId("refresh").focus({ preventScroll:true }); },650);
    };
    byId("open-menu").onclick = openMenu; byId("close-menu").onclick = closeMenu;
    byId("close-detail").onclick = closeDetail; byId("scrim").onclick = () => state.menu ? closeMenu() : closeDetail();
    byId("detail-star").onclick = () => toggleStar(state.detailId);
    byId("add-feed").onclick = openFeedDialog; byId("manage-add").onclick = openFeedDialog;
    byId("cancel-feed").onclick = byId("close-feed-dialog").onclick = () => byId("feed-dialog").close();
    byId("feed-url").addEventListener("blur", validateUrl);
    byId("feed-url").addEventListener("input", () => { if (byId("feed-url").getAttribute("aria-invalid") === "true") validateUrl(); });
    byId("use-example").onclick = () => { byId("feed-url").value = `https://example.com/${byId("feed-kind").value}-${Date.now()}.xml`; if (!byId("feed-name").value.trim()) byId("feed-name").value = `${typeNames[byId("feed-kind").value]}示例订阅`; validateUrl(); };
    byId("feed-kind").onchange = () => byId("url-help").textContent = byId("feed-kind").value === "article" ? "支持 HTTP / HTTPS 地址。知乎订阅格式需要后端单独确认。" : "这里只校验地址格式，不检查真实RSS可用性或B站登录状态。";
    byId("feed-form").onsubmit = event => {
      event.preventDefault(); if (!validateUrl()) { byId("feed-url").focus(); return; }
      const feed = { id:`mock-${Date.now()}`, title:byId("feed-name").value.trim() || `${typeNames[byId("feed-kind").value]}演示订阅`, type:byId("feed-kind").value, source:byId("feed-kind").value === "article" ? "知乎 / 文章" : byId("feed-kind").value === "video" ? "B站" : "播客", url:byId("feed-url").value.trim() };
      const controls = [...byId("feed-form").querySelectorAll("input,select,button")]; controls.forEach(control => control.disabled = true); byId("submit-status").textContent = "正在添加到本地演示…";
      setTimeout(() => { feeds.push(feed); persist(); state.feedId = feed.id; state.scope = "inbox"; state.type = "all"; state.query = ""; byId("search").value = ""; render(); controls.forEach(control => control.disabled = false); byId("submit-status").textContent = ""; byId("feed-dialog").close(); byId("feed-form").reset(); byId("url-error").textContent = ""; byId("feed-url").removeAttribute("aria-invalid"); byId("main").focus(); notify("演示订阅已添加，可以放入一条示例内容。"); },450);
    };
    byId("account-button").onclick = () => { closeMenu(); byId("account-dialog").showModal(); };
    byId("close-account").onclick = () => byId("account-dialog").close();
    byId("login-demo").onclick = () => byId("account-status").textContent = "真实版本在此进入B站扫码登录。本地原型不生成二维码、不登录，也不读取凭证。";
    byId("import-demo").onclick = () => { if (feeds.some(feed => feed.id === "mock-follow")) { byId("account-status").textContent = "演示关注已导入，可在订阅菜单中找到。"; return; } feeds.push({ id:"mock-follow", title:"演示关注 · 影像笔记", type:"video", source:"B站", url:"https://example.com/demo-follow.xml" }); persist(); render(); byId("account-status").textContent = "已加入一份演示关注，没有读取真实B站账号。选择该订阅可放入示例视频。"; };
    byId("audio-toggle").onclick = () => { const entry = entries.find(item => item.id === audio.id); if (!entry) return; if (audio.progress >= entry.duration) audio.progress = 0; audio.playing = !audio.playing; if (audio.playing) { video.playing = false; syncVideo(); } syncAudio(); };
    byId("audio-progress").oninput = event => { audio.progress = Number(event.target.value); syncAudio(); };
    byId("audio-speed").onchange = event => audio.speed = Number(event.target.value);
    byId("back-15").onclick = () => { audio.progress = Math.max(0,audio.progress-15); syncAudio(); };
    byId("forward-15").onclick = () => { const entry = entries.find(item => item.id === audio.id); audio.progress = Math.min(entry.duration,audio.progress+15); syncAudio(); };
    byId("player-title").onclick = () => openDetail(audio.id,"player-title");
    byId("stop-audio").onclick = () => { audio.playing = false; audio.id = null; byId("mini-player").hidden = true; resizePlayer(); if (byId("episode-play")) byId("episode-play").textContent = "开始演示收听"; (state.detailId ? byId("close-detail") : byId("main")).focus({ preventScroll:true }); };
    byId("detail-body").addEventListener("input", event => { if (event.target.id === "video-progress") { video.progress = Number(event.target.value); syncVideo(); } });
    byId("detail-body").addEventListener("change", event => { if (event.target.id === "video-quality") { video.quality = event.target.value; byId("quality-note").textContent = `已选择${video.quality}P；演示返回档位720P。实际清晰度：未获取，无真实B站流。`; announce(byId("quality-note").textContent); } });
    setInterval(() => {
      if (audio.playing) { const entry = entries.find(item => item.id === audio.id); audio.progress = Math.min(entry.duration,audio.progress+audio.speed); if (audio.progress >= entry.duration) { audio.playing = false; announce("播客演示已结束"); } syncAudio(); }
      if (video.playing) { const entry = entries.find(item => item.id === video.id); video.progress = Math.min(entry.duration,video.progress+1); if (video.progress >= entry.duration) video.playing = false; syncVideo(); }
    },1000);
    document.addEventListener("keydown", event => {
      if (byId("feed-dialog").open || byId("account-dialog").open) return;
      if (event.key === "Escape") { if (state.menu) closeMenu(); else if (state.detailId) closeDetail(); else byId("toast").hidden = true; }
      if (event.key === "Tab" && (state.detailId || state.menu)) {
        const roots = state.menu ? [byId("sidebar")] : [byId("detail"), ...(audio.id ? [byId("mini-player")] : [])];
        const focusable = roots.flatMap(root => [...root.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href]')]).filter(element => element.getClientRects().length);
        const first = focusable[0], last = focusable[focusable.length-1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
      if (event.key === "/" && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName) && !state.detailId && !state.menu) { event.preventDefault(); byId("search").focus(); }
    });
    window.addEventListener("resize", () => { resizePlayer(); if (window.innerWidth >= 768 && state.menu) closeMenu(); });
    byId("dismiss-toast").onclick = () => byId("toast").hidden = true;
    ["close-menu","clear-search","close-feed-dialog","close-account","dismiss-toast","stop-audio"].forEach(id => byId(id).innerHTML = icon("close"));
    byId("open-menu").innerHTML = icon("menu"); byId("close-detail").innerHTML = icon("back"); byId("refresh").innerHTML = icon("refresh"); byId("audio-toggle").innerHTML = icon("play");
    render(); if (storageWarning) notify("本地保存记录无法读取，已恢复默认演示内容。");
  </script>
</body>
